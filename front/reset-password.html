<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <script src="js/dialog-shell.js"></script>
    <script src="js/confirm-dialog.js"></script>
    <link rel="stylesheet" href="dialog-shell.css" />
    <link rel="stylesheet" href="confirm-dialog.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>Recuperar senha — Arcádia</title>
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="bundle.css" />

    <link rel="icon" type="image/png" sizes="64x64" href="public/arcadia-logo-64.png" />
    <link rel="stylesheet" href="scrollbars.css" />
    <link rel="stylesheet" href="email-verification.css" />
    <script src="js/theme.js"></script>
    <link rel="stylesheet" href="credentials.css" />
    <link rel="stylesheet" href="site-footer.css?v=3" />
    <link rel="stylesheet" href="privacy-notice.css" />
  </head>
  <body class="ar-email-body">
    <main class="ar-email-page">
      <a class="ar-email-brand" href="index.html"
        ><img src="public/arcadia-logo-64.png" alt="" />Arcádia</a
      >
      <h1 id="recoveryTitle">Recuperar senha</h1>
      <p id="recoveryHelp">Informe o e-mail da sua conta para receber um link de redefinição.</p>
      <form id="requestRecoveryForm">
        <label
          >E-mail <input name="email" type="email" maxlength="254" autocomplete="email" required
        /></label>
        <button class="ar-btn ar-btn--primary" type="submit">Enviar link</button>
      </form>
      <form id="resetPasswordForm" hidden>
        <label
          >Nova senha
          <input
            name="novaSenha"
            type="password"
            minlength="8"
            autocomplete="new-password"
            required
        /></label>
        <label
          >Confirmar senha
          <input
            name="confirmacao"
            type="password"
            minlength="8"
            autocomplete="new-password"
            required
        /></label>
        <button class="ar-btn ar-btn--primary" type="submit">Redefinir senha</button>
      </form>
      <p id="recoveryStatus" role="status" aria-live="polite"></p>
      <p class="ar-email-footer"><a href="login.html">Voltar para entrar</a></p>
    </main>
    <script src="js/person-name.js"></script>
<script src="js/api.js"></script>
    <script src="js/password-recovery.js"></script>

    <footer class="ar-site-footer" aria-label="Contato e informações legais">
      <span>Arcádia · Portal acadêmico</span>
      <nav aria-label="Contato e documentos">
        <a href="mailto:portalarcadia.contato@gmail.com">portalarcadia.contato@gmail.com</a>
        <a href="privacy.html">Política de Privacidade</a>
        <a href="terms.html">Termos de Uso</a>
        <a href="cookies.html">Política de Cookies</a>
      </nav>
    </footer>
    <script src="js/privacy-notice.js"></script>
  </body>
</html>
