<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>Recuperar senha — Arcádia</title>
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="auth.css" />
    <style>
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #fafaf8;
        color: #10141a;
      }
      main {
        width: min(100% - 40px, 440px);
        padding: 32px 0;
      }
      form {
        display: grid;
        gap: 16px;
        margin: 24px 0;
      }
      label {
        display: grid;
        gap: 8px;
      }
      input,
      button {
        font: inherit;
        padding: 12px 16px;
      }
      button {
        cursor: pointer;
        background: #10141a;
        color: white;
        border: 0;
        border-radius: 24px;
      }
      [hidden] {
        display: none !important;
      }
    </style>
    <link rel="icon" type="image/png" sizes="64x64" href="public/arcadia-logo-64.png" />
    <link rel="stylesheet" href="scrollbars.css" />
  </head>
  <body>
    <main>
      <a href="index.html">Arcádia</a>
      <h1 id="recoveryTitle">Recuperar senha</h1>
      <p id="recoveryHelp">Informe o e-mail da sua conta para receber um link de redefinição.</p>
      <form id="requestRecoveryForm">
        <label
          >E-mail <input name="email" type="email" maxlength="254" autocomplete="email" required
        /></label>
        <button type="submit">Enviar link</button>
      </form>
      <form id="resetPasswordForm" hidden>
        <label
          >Nova senha
          <input
            name="novaSenha"
            type="password"
            minlength="8"
            autocomplete="new-password"
            required
        /></label>
        <label
          >Confirmar senha
          <input
            name="confirmacao"
            type="password"
            minlength="8"
            autocomplete="new-password"
            required
        /></label>
        <button type="submit">Redefinir senha</button>
      </form>
      <p id="recoveryStatus" role="status" aria-live="polite"></p>
      <a href="login.html">Voltar para entrar</a>
    </main>
    <script src="js/api.js"></script>
    <script src="js/password-recovery.js"></script>
  </body>
</html>
