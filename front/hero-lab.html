<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcádia — Hero v2 (laboratório)</title>

    <!-- :root + tokens -->
    <link rel="stylesheet" href="landing.css">
    <!-- nossas regras -->
    <link rel="stylesheet" href="hero-v2.css">
    <link rel="stylesheet" href="style.css">

    <!-- tipografia: Schibsted Grotesk (site) + Instrument Serif (headline) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Schibsted+Grotesk:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
</head>
<body>

    <div class="hero2-root">
        <div class="hero2-inner">

            <!-- BADGE -->
            <span class="hero2-badge">Arcádia · Plataforma do campus</span>

            <!-- HEADLINE — serif, dois tons, monoline inline entre "sua" e "instituição" -->
            <h1 class="hero2-titulo">
                <span class="hero2-titulo-forte">Tudo que a sua</span>
                <svg class="hero2-inline-monoline" viewBox="0 0 64 40" aria-hidden="true">
                    <!-- quadro visto de frente: 2 folhas -->
                    <rect x="4" y="4" width="56" height="32" rx="2"
                          fill="none" stroke="var(--tinta)" stroke-width="1.5" stroke-linecap="round"/>
                    <rect x="12" y="11" width="14" height="18" rx="1"
                          fill="none" stroke="var(--tinta)" stroke-width="1.5" stroke-linecap="round"/>
                    <rect x="28" y="10" width="18" height="20" rx="1"
                          fill="none" stroke="var(--tinta)" stroke-width="1.5" stroke-linecap="round"/>
                    <!-- apoio horizontal na base -->
                    <line x1="5" y1="34" x2="59" y2="34"
                          stroke="var(--tinta)" stroke-width="1.5" stroke-linecap="round" opacity="0.35"/>
                </svg>
                <span class="hero2-titulo-forte">instituição publica,</span>
                <span class="hero2-titulo-suave">em um lugar só</span>
            </h1>

            <!-- LINHA DE CATEGORIAS -->
            <div class="hero2-categorias">
                <span class="hero2-categoria">Avisos<span class="hero2-estrela" aria-hidden="true">✳</span></span>
                <span class="hero2-categoria">Documentos<span class="hero2-estrela" aria-hidden="true">✳</span></span>
                <span class="hero2-categoria">Projetos<span class="hero2-estrela" aria-hidden="true">✳</span></span>
                <span class="hero2-categoria">Editais<span class="hero2-estrela" aria-hidden="true">✳</span></span>
            </div>

            <!-- CTAs -->
            <div class="hero2-ctas">
                <a class="hero2-cta-primario" href="#">Criar conta</a>
                <a class="hero2-cta-secundario" href="#">Entrar no portal</a>
            </div>

            <!-- PROVA -->
            <p class="hero2-prova">1.284 alunos com conta ativa</p>

        </div>

        <!-- CARD ESQUERDO — EDITAL -->
        <article class="hero2-card hero2-card-left">
            <span class="hero2-card-tag hero2-card-tag-vermelho">Edital</span>
            <p class="hero2-card-titulo">Edital 012/2026</p>
        </article>

        <!-- CARD DIREITO — MATRÍCULA -->
        <article class="hero2-card hero2-card-right">
            <span class="hero2-card-tag hero2-card-tag-azul">Matrícula</span>
            <p class="hero2-card-titulo">Matrícula 2026/2</p>
        </article>

        <!-- MONOLINE — canto inferior direito -->
        <svg class="hero2-monoline" viewBox="0 0 240 180" aria-hidden="true">
            <g transform="rotate(-5 120 90)">
                <rect x="20" y="40" width="200" height="100" rx="2"
                      fill="none" stroke="var(--tinta)" stroke-width="1.5" stroke-linecap="round"/>
                <rect x="40" y="60" width="36" height="56" rx="1"
                      fill="none" stroke="var(--tinta)" stroke-width="1.5" stroke-linecap="round"/>
                <rect x="84" y="54" width="40" height="64" rx="1"
                      fill="none" stroke="var(--tinta)" stroke-width="1.5" stroke-linecap="round"/>
                <rect x="132" y="64" width="32" height="50" rx="1"
                      fill="none" stroke="var(--tinta)" stroke-width="1.5" stroke-linecap="round"/>
                <line x1="20" y1="140" x2="220" y2="140"
                      stroke="var(--tinta)" stroke-width="1.5" stroke-linecap="round" opacity="0.35"/>
            </g>
        </svg>

    </div>

    <!-- Parallax leve via JS (desktop apenas, motion preferido) -->
    <script>
        (function() {
            if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
            if (window.innerWidth < 1281) return;

            var cards = document.querySelectorAll('.hero2-card');
            var rootEl = document.querySelector('.hero2-root');

            function onMove(e) {
                var rect = rootEl.getBoundingClientRect();
                var cx = rect.left + rect.width / 2;
                var cy = rect.top + rect.height / 2;
                var dx = (e.clientX - cx) / rect.width;
                var dy = (e.clientY - cy) / rect.height;
                var max = 12;

                cards.forEach(function(card, i) {
                    var phase = i === 0 ? -0.35 : 0.35;
                    var x = dx * max * (0.5 + phase * 0.5);
                    var y = dy * -max * (0.35 + phase * 0.3);
                    card.style.transform = 'translate(' + x + 'px, ' + y + 'px)';
                });
            }

            document.addEventListener('mousemove', onMove);

            document.addEventListener('mouseleave', function() {
                cards.forEach(function(card) {
                    card.style.transform = '';
                });
            });
        })();
    </script>
</body>
</html>
